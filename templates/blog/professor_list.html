{% extends "base.html" %}

{% block title %}Professors - Valoracions Profes{% endblock %}

{% block content %}
<h1 style="text-align: center; margin-bottom: 1.5rem;">Professors</h1>

<div class="search-box">
    <label for="id_professor">🔍 Cerca un professor:</label>
    <input id="id_professor" type="text" placeholder="Escriu-ne el nom...">
</div>

<ul class="professor-list">
{% for professor in professors %}
    <li>
        <a href="{% url 'blog:professor_detail' professor.pk %}">
            {{ professor.name_prof }}
        </a>
    </li>
{% empty %}
    <li>No hi ha professors registrats.</li>
{% endfor %}
</ul>

<script>
$(function() {
    $("#id_professor").val('');

    $("#id_professor").autocomplete({
        source: function(request, response) {
            $.ajax({
                url: "{% url 'blog:professor_autocomplete' %}",
                data: { term: request.term },
                success: function(data) {
                    response(data);
                }
            });
        },
        select: function(event, ui) {
            window.location.href = ui.item.url;
        }
    });
});
</script>

{% endblock %}
