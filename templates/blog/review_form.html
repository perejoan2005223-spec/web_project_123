{% extends 'base.html' %}

{% block content %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<div class="form-narrow">
    <h2>{% if object %}Editar ressenya{% else %}Nova ressenya{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="button" id="btn-api-externa" class="btn-blue" style="background-color: #17a2b8; margin-bottom: 15px; padding: 5px 10px; font-size: 0.9em; width: 100%;">
            🌍 Tradueix el comentari a l'anglès (API Externa)
        </button>
        <br>
        <button type="submit" class="btn-blue" style="margin-top: 15px;">Desa la ressenya</button>
        <div style="text-align: center; margin-top: 15px;">
            <a href="javascript:history.back()" style="color: gray; text-decoration: none;">Cancel·la i torna enrere</a>
        </div>
    </form>
</div>

<script>
    $(document).ready(function() {
        $("#btn-api-externa").click(function() {
            var textActual = $("#id_comment").val();

            // Comprovem que l'usuari hagi escrit alguna cosa abans de cridar l'API
            if (!textActual) {
                alert("Si us plau, escriu primer un comentari a la caixa de text per poder-lo traduir.");
                return;
            }
            var btn = $(this);
            var textOriginal = btn.text();
            btn.text("⏳ Traduint amb l'API externa...");

            // Cridem a l'API externa de MyMemory per traduïr
            $.ajax({
                url: "https://api.mymemory.translated.net/get",
                type: "GET",
                data: {
                    q: textActual,
                    langpair: "ca|en" // De Català al anglés.
                },
                dataType: "json",
                success: function(data) {
                    if (data.responseData && data.responseData.translatedText) {
                        // Posem el text traduït al formulari
                        $("#id_comment").val(data.responseData.translatedText);
                    } else {
                        alert("L'API no ha retornat cap traducció.");
                    }
                    // Tornem el botó a la normalitat
                    btn.text(textOriginal);
                },
                error: function() {
                    alert("Hi ha hagut un error en connectar amb l'API externa de traducció.");
                    btn.text(textOriginal);
                }
            });
        });
    });
</script>
{% endblock content %}
